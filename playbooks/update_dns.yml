---
- name: Atualizar firmware Planet GS-4210-24T4S via SSH + TFTP
  hosts: sw-teste
  gather_facts: false

  vars:
    tftp_server: "172.16.30.20"
    firmware_file: "GS-4210-24T4S_v1.305.ros"
    backup_dir: "/srv/tftp"
    wait_boot: 90

  tasks:

    #####################################################################
    # 1. Coletar versão atual
    #####################################################################
    - name: Coletar versão atual
      expect:
        command: "show system information"
        responses: {}
        timeout: 10
      register: ver_before

    - debug:
        msg: "Versão atual: {{ ver_before.stdout }}"

    #####################################################################
    # 2. Backup da configuração
    #####################################################################
    - name: Coletar running-config
      expect:
        command: "show running-config"
        responses: {}
        timeout: 20
      register: runconf

    - name: Salvar running-config localmente
      local_action:
        module: copy
        content: "{{ runconf.stdout }}"
        dest: "{{ backup_dir }}/{{ inventory_hostname }}-running-config.cfg"

    #####################################################################
    # 3. Testar conexão com TFTP
    #####################################################################
    - name: Testar reachability do TFTP server
      expect:
        command: "ping {{ tftp_server }} count 3"
        responses: {}
        timeout: 15
      register: ping_tftp

    - name: Falhar se TFTP não responde
      fail:
        msg: "TFTP {{ tftp_server }} não responde. Saída: {{ ping_tftp.stdout }}"
      when: "'Success rate is 0 percent' in ping_tftp.stdout"

    #####################################################################
    # 4. Upload de firmware via TFTP
    #####################################################################
    - name: Enviar firmware via TFTP
      expect:
        command: "copy tftp firmware {{ tftp_server }} {{ firmware_file }}"
        responses:
          "Are you sure": "Y"
        timeout: 120
      register: fw_upload

    - debug:
        msg: "Resultado do upload: {{ fw_upload.stdout }}"

    #####################################################################
    # 5. Tempo para gravação da imagem
    #####################################################################
    - name: Aguardar gravação do firmware
      pause:
        seconds: 40

    #####################################################################
    # 6. Reboot
    #####################################################################
    - name: Reboot do switch
      expect:
        command: "reboot"
        responses:
          "Are you sure": "Y"
        timeout: 10
      ignore_errors: true

    #####################################################################
    # 7. Aguarda boot
    #####################################################################
    - name: Esperar switch inicializar
      pause:
        seconds: "{{ wait_boot }}"

    #####################################################################
    # 8. Coletar versão após o reboot
    #####################################################################
    - name: Coletar versão após atualização
      expect:
        command: "show system information"
        responses: {}
        timeout: 20
      register: ver_after

    #####################################################################
    # 9. Comparar versões
    #####################################################################
    - name: Comparar versões
      debug:
        msg: |
          ANTES:
          {{ ver_before.stdout }}

          DEPOIS:
          {{ ver_after.stdout }}

