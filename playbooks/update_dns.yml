---
- name: Atualizar firmware em switches PLANET GS-4210-24T4S (via CLI)
  hosts: sw-teste
  gather_facts: false
  connection: ansible.netcommon.network_cli
  vars:
    tftp_server: "172.16.30.20"
    firmware_file: "GS-4210-24T4S_v1.305b251017.ros"
    backup_dir: "/srv/tftp"
    ansible_network_os: ios

  tasks:

    - name: Coletar versão atual
      ansible.netcommon.cli_command:
        command: "show system information"
      register: ver_before

    - name: Backup do running-config
      ansible.netcommon.cli_command:
        command: "show running-config"
      register: runconf

    - name: Upload de firmware via TFTP
      ansible.netcommon.cli_command:
        command: "copy tftp firmware {{ tftp_server }} {{ firmware_file }}"
        prompt: "Are you sure? (Y/N)"
        answer: "Y"
      register: fw_upload

    - name: Reboot
      ansible.netcommon.cli_command:
        command: "reboot"
        prompt: "Are you sure? (Y/N)"
        answer: "Y"
      ignore_errors: true

    - pause:
        seconds: 90

    - name: Coletar versão após upgrade
      ansible.netcommon.cli_command:
        command: "show system information"
      register: ver_after
