---
- name: Atualizar firmware em switches PLANET (via CLI/TFTP - conexão SSH)
  hosts: sw-teste
  gather_facts: false
  connection: ssh
  vars:
    ansible_user: admin
    ansible_password: admin
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o KexAlgorithms=+diffie-hellman-group1-sha1 -o HostKeyAlgorithms=+ssh-rsa"
    tftp_server: "172.16.30.20"
    firmware_file: "FW-GS-4210-24T4S_v1.305b251017.zip"
    backup_dir: "/srv/tftp"

  tasks:

    - name: Coletar versão atual
      ansible.builtin.shell: "show version"
      register: ver_before

    - name: Salvar versão atual localmente
      local_action:
        module: copy
        content: "{{ ver_before.stdout | default('') }}"
        dest: "{{ backup_dir }}/{{ inventory_hostname }}-version-before.txt"

    - name: Backup da configuração (show running-config)
      ansible.builtin.shell: "show running-config"
      register: runconf

    - name: Salvar backup da config localmente
      local_action:
        module: copy
        content: "{{ runconf.stdout | default('') }}"
        dest: "{{ backup_dir }}/{{ inventory_hostname }}-running-config.cfg"

    - name: Testar reachability do TFTP server
      ansible.builtin.shell: "ping {{ tftp_server }} count 3"
      register: ping_tftp

    - name: Falhar se TFTP não responder
      ansible.builtin.fail:
        msg: "TFTP {{ tftp_server }} não alcançável. Saída: {{ ping_tftp.stdout }}"
      when: "'Success rate is 0 percent' in ping_tftp.stdout"

    - name: Iniciar transferência do firmware via TFTP
      ansible.builtin.shell: "copy tftp firmware {{ tftp_server }} {{ firmware_file }}"
      register: copy_fw

    - name: Mostrar saída da cópia de firmware
      ansible.builtin.debug:
        var: copy_fw.stdout

    - name: Esperar switch finalizar escrita
      ansible.builtin.pause:
        seconds: 30

    - name: Reboot / reload switch
      ansible.builtin.shell: "reboot"
      register: reboot_cmd
      ignore_errors: yes

    - name: Aguardar boot
      ansible.builtin.pause:
        seconds: 90

    - name: Verificar versão após reboot
      ansible.builtin.shell: "show version"
      register: ver_after

    - name: Salvar versão após atualização
      local_action:
        module: copy
        content: "{{ ver_after.stdout | default('') }}"
        dest: "{{ backup_dir }}/{{ inventory_hostname }}-version-after.txt"

    - name: Comparar versões
      ansible.builtin.debug:
        msg: "ANTES: {{ ver_before.stdout | truncate(80) }} | DEPOIS: {{ ver_after.stdout | truncate(80) }}"
